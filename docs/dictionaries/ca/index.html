<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diccionari fonètic català</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Top Banner -->
  <header class="banner">
    <h1>DICCIONARI FONÈTIC CATALÀ</h1>
  </header>

  <main>
    <input id="search" type="text" placeholder="Cerca una paraula o IPA (ex. bona, ˈbɔ.nə)…" autofocus>
    
    <div id="status">Carregant diccionari…</div>
    <div id="results"></div>

    <footer>
      Dades de pronunciació generades amb eines de codi obert.
    </footer>
  </main>

  <!-- Catalan Flag at the bottom -->
  <div class="flag-footer"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
