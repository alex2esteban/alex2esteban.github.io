<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dictionaries</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-family=%22system-ui,sans-serif%22 font-weight=%22bold%22 font-size=%2255%22 fill=%22%23333%22>文</text></svg>">

<body>
  <div class="container">
    <header>
      <h1>Dictionaries</h1>

    <div class="grid">

      <a href="./zh/" class="card">

      <!-- English IPA Dictionary -->
      <a href="./en/" class="card">

      </a>

      <!-- Catalan Dictionary -->
      <a href="./ca/" class="card">
        <h2>Català</h2>
        <p>Diccionari Fonètic<br>Paraules i transcripcions IPA</p>
      </a>
    </div>
  </div>

</html>
