<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dictionaries</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Dictionaries</h1>
      <p>Select a dictionary to start searching.</p>
    </header>

    <div class="grid">
      <!-- Chinese Dictionary -->
      <a href="./zh/" class="card">
        <h2>Chinese</h2>
        <p>CC-CEDICT<br>Hanzi, Pinyin & English</p>
      </a>

      <!-- English IPA Dictionary -->
      <a href="./en/" class="card">
        <h2>English</h2>
        <p>IPA Pronunciations<br>Word to IPA mapping</p>
      </a>

      <!-- Catalan Dictionary -->
      <a href="./ca/" class="card">
        <h2>Català</h2>
        <p>Diccionari Fonètic<br>Paraules i transcripcions IPA</p>
      </a>
    </div>
  </div>
</body>
</html>
